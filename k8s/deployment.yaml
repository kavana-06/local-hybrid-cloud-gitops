apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-monitor

spec:
  replicas: 1

  selector:
    matchLabels:
      app: system-monitor

  template:
    metadata:
      labels:
        app: system-monitor

    spec:
      containers:
        - name: monitor
          image: kavanabt6/local-hybrid-cloud-monitor:c3ff42c
          imagePullPolicy: Always

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
